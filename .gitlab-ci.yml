image: node:20

stages: [check, build, e2e]

cache:
  key: { files: [package-lock.json] }
  paths: [node_modules/]

check:
  stage: check
  script:
    - npm ci
    - npm run lint
    - npm test

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.47.0-jammy
  script:
    - npm ci
    - npm run build
    - npx playwright test
  artifacts:
    when: on_failure
    paths: [test-results/]
